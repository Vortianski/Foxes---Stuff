plugins {
    id 'dev.architectury.loom-no-remap' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-fabric"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    api "dev.architectury:architectury-fabric:${architectury_version}"
}

loom {
    mixin {
        defaultRefmapName = "foxesstuff.refmap.json"
    }

    runs {
        client {
            client()
        }

        server {
            server()
        }
    }
}

sourceSets {
    main {
        java.srcDir rootProject.file('core/src/main/java')
        resources.srcDir rootProject.file('core/src/main/resources')
        resources.srcDir rootProject.file('core/src/generated/resources')
        resources.exclude '**/*.bbmodel'
        resources.exclude '**/.cache/**'
    }
}

def modVersion = version

processResources {
    inputs.property 'version', modVersion

    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${mod_id}-fabric"
            from components.java
        }
    }

    repositories {
        maven {
            name = 'localFabric'
            url = uri(rootProject.file('repo/fabric'))
        }
    }
}
